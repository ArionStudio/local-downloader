[package]
name = "downloader"
version = "0.1.19"
description = "Download videos and media assets."
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"
autobins = false
default-run = "Downloader"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "Downloader"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "downloader-cli"
path = "src/bin/downloader-cli.rs"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-log", "dep:tauri-plugin-dialog", "dep:tauri-plugin-clipboard-manager", "dep:tauri-plugin-updater"]

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [], optional = true }

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
schemars = "1"
ctrlc = { version = "3.4", features = ["termination"] }
dirs = "6"
fs2 = "0.4"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
base64 = "0.22.1"
aes = "0.8.4"
cbc = { version = "0.1.2", features = ["alloc"] }
log = "0.4"
pbkdf2 = "0.12.2"
tauri = { version = "2.11.3", features = ["protocol-asset"], optional = true }
tauri-plugin-log = { version = "2", optional = true }
rusqlite = { version = "0.40.1", features = ["bundled"] }
sha1 = "0.10.6"
uuid = { version = "1.20.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
url = "2.5.8"
regex = "1.12.4"
rust_xlsxwriter = "0.96.0"
libc = "0.2"
thiserror = "2.0.18"
tauri-plugin-dialog = { version = "2.7.1", optional = true }
ureq = "3.2.1"
sha2 = "0.10.9"
tiny_http = "0.12"
tauri-plugin-clipboard-manager = { version = "2.3.2", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9.12"
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = { version = "2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
