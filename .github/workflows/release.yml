name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "app-v*"

jobs:
  release:
    name: ${{ matrix.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            isMac: true
            assetPrefix: macos
            args: "--target aarch64-apple-darwin --bundles app,dmg"
            rustTarget: aarch64-apple-darwin
            macArch: arm64
            tauriScript: ""
          - name: macOS Intel
            platform: macos-latest
            isMac: true
            assetPrefix: macos
            args: "--target x86_64-apple-darwin --bundles app,dmg"
            rustTarget: x86_64-apple-darwin
            macArch: x86_64
            tauriScript: ""
          - name: Ubuntu deb
            platform: ubuntu-22.04
            isMac: false
            assetPrefix: ubuntu
            args: "--bundles deb"
            tauriScript: ""
          - name: Arch CachyOS AppImage
            platform: ubuntu-22.04
            isMac: false
            assetPrefix: arch
            args: "--bundles appimage"
            tauriScript: "./scripts/tauri-appimage-build.sh"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Setup Rust
        if: ${{ !matrix.isMac }}
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust macOS targets
        if: matrix.isMac
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTarget }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure ad-hoc macOS signing
        if: matrix.isMac
        run: |
          echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          echo "Configured ad-hoc signing; this build will not be notarized by Apple."

      - name: Build and upload release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__
          releaseName: "Downloader v__VERSION__"
          releaseBody: |
            Download the installer for your platform. The app updater uses latest.json from this release.

            macOS builds are ad-hoc signed and are not notarized by Apple. On first launch, macOS users must allow Downloader in System Settings → Privacy & Security → Open Anyway.
          # Keep artifacts private until every platform build and integrity
          # check below has succeeded.
          releaseDraft: true
          prerelease: false
          releaseAssetNamePattern: "${{ matrix.assetPrefix }}_[bundle]_[arch]_[name]_[version][ext]"
          tauriScript: ${{ matrix.tauriScript }}
          args: ${{ matrix.args }}

      - name: Verify ad-hoc-signed macOS bundle
        if: matrix.isMac
        env:
          EXPECTED_ARCH: ${{ matrix.macArch }}
          RUST_TARGET: ${{ matrix.rustTarget }}
        run: |
          set -euo pipefail

          app="$(find "src-tauri/target/$RUST_TARGET/release/bundle/macos" -maxdepth 1 -name '*.app' -type d -print -quit)"
          if [ -z "$app" ]; then
            echo "No macOS app bundle was produced." >&2
            exit 1
          fi

          executable="$app/Contents/MacOS/Downloader"
          codesign --verify --deep --strict --verbose=4 "$app"
          signature_info="$(codesign -dv --verbose=4 "$app" 2>&1)"
          printf '%s\n' "$signature_info"
          printf '%s\n' "$signature_info" | grep -F "Signature=adhoc"
          printf '%s\n' "$signature_info" | grep -F "TeamIdentifier=not set"
          lipo -archs "$executable" | tr ' ' '\n' | grep -Fx "$EXPECTED_ARCH"

  publish:
    name: Publish verified release
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="app-v$(jq -r '.version' package.json)"
          gh release edit "$tag" --draft=false --latest
