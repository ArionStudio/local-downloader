name: mac release diagnostics

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to inspect"
        required: true
        default: "app-v0.1.17"

jobs:
  diagnose:
    name: Verify ad-hoc macOS release assets
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Download all macOS release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'macos_dmg_*.dmg' \
            --pattern 'macos_app_*.app.tar.gz' \
            --dir artifacts

          shopt -s nullglob
          assets=(artifacts/*)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No macOS DMG or updater app assets found in $TAG." >&2
            exit 1
          fi
          ls -lah artifacts
          file artifacts/*
          shasum -a 256 artifacts/*

      - name: Verify every DMG
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(artifacts/macos_dmg_*.dmg)
          if [ "${#dmgs[@]}" -eq 0 ]; then
            echo "No macOS DMG assets were downloaded." >&2
            exit 1
          fi

          mounted=""
          cleanup() {
            if [ -n "$mounted" ]; then
              hdiutil detach "$mounted" || true
            fi
          }
          trap cleanup EXIT

          verify_app() {
            app="$1"
            echo "Verifying $app"
            plutil -p "$app/Contents/Info.plist"
            codesign --verify --deep --strict --verbose=4 "$app"

            signature_info="$(codesign -dv --verbose=4 "$app" 2>&1)"
            printf '%s\n' "$signature_info"
            printf '%s\n' "$signature_info" | grep -F "Signature=adhoc"
            printf '%s\n' "$signature_info" | grep -F "TeamIdentifier=not set"
          }

          for dmg in "${dmgs[@]}"; do
            echo "Verifying $dmg"
            hdiutil verify "$dmg"
            mount_dir="$(mktemp -d)"
            hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_dir"
            mounted="$mount_dir"

            app="$(find "$mount_dir" -maxdepth 2 -name '*.app' -type d -print -quit)"
            if [ -z "$app" ]; then
              echo "No app bundle found in $dmg." >&2
              exit 1
            fi
            verify_app "$app"

            hdiutil detach "$mount_dir"
            mounted=""
          done

      - name: Verify every updater app tarball
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(artifacts/macos_app_*.app.tar.gz)
          if [ "${#tarballs[@]}" -eq 0 ]; then
            echo "No macOS updater app tarballs were downloaded." >&2
            exit 1
          fi

          verify_app() {
            app="$1"
            echo "Verifying $app"
            plutil -p "$app/Contents/Info.plist"
            codesign --verify --deep --strict --verbose=4 "$app"

            signature_info="$(codesign -dv --verbose=4 "$app" 2>&1)"
            printf '%s\n' "$signature_info"
            printf '%s\n' "$signature_info" | grep -F "Signature=adhoc"
            printf '%s\n' "$signature_info" | grep -F "TeamIdentifier=not set"
          }

          for tarball in "${tarballs[@]}"; do
            extract_dir="$(mktemp -d)"
            tar -xzf "$tarball" -C "$extract_dir"
            app="$(find "$extract_dir" -maxdepth 3 -name '*.app' -type d -print -quit)"
            if [ -z "$app" ]; then
              echo "No app bundle found in $tarball." >&2
              exit 1
            fi
            verify_app "$app"
          done
